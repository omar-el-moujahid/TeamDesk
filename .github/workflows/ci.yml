name: CI

on:
  push:
    branches: [main]          
  pull_request:
    branches: [main]          

jobs:
  backend:
    runs-on: ubuntu-latest    
    steps:
      - uses: actions/checkout@v4            
      - uses: actions/setup-dotnet@v4        
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore TeamDesk.slnx
      - run: dotnet build TeamDesk.slnx --no-restore -c Release
      - run: dotnet test TeamDesk.slnx --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamdesk-web       
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: teamdesk-web/package-lock.json
      - run: npm ci                           
      - run: npx ng build                     