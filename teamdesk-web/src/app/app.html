<header>
  <h1>{{ title }}</h1>

  @if (auth.isLoggedIn()) {
    <nav>
      <a routerLink="/requests" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Demandes</a>

      @if (!auth.isManager()) {
        <a routerLink="/requests/new" routerLinkActive="active">Nouvelle demande</a>
      }
      @if (auth.isManager()) {
        <a routerLink="/dashboard" routerLinkActive="active">Tableau de bord</a>
      }
    </nav>

    <div class="user">
      <span>{{ auth.user()?.name }} ({{ auth.user()?.role }})</span>
      <button (click)="auth.logout()">Déconnexion</button>
    </div>
  }
</header>

<main>
  <router-outlet />
</main>
